# Hugo configuration file
title: Awesome Devin

# GitHub Pages base path
baseURL: https://detailobsessed.github.io/awesome-devin/
locale: en-us

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Tips
      pageRef: /tips
      weight: 1
    - name: Gotchas
      pageRef: /gotchas
      weight: 2
    - name: FAQ
      pageRef: /faq
      weight: 3
    - name: Rules
      pageRef: /rules
      weight: 4
    - name: MCP
      pageRef: /mcp
      weight: 5
    - name: Tools
      pageRef: /tools
      weight: 6
    - name: Contributing
      pageRef: /contributing
      weight: 7
    - name: Search
      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: "https://github.com/detailobsessed/awesome-devin"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/detailobsessed/awesome-devin/edit/main/content"

  # Hextra theme params
  theme:
    default: light
    backToTop:
      display: true

    search:
      enable: true
      type: flexsearch
      flexsearch:
        index: content

    blog:
      list:
        displayTags: true
